;
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; `pio run` builds firmware, `pio test` runs host-side unit tests ([env:native]).
[platformio]
default_envs = esp32-poe-iso, wt32-eth01

[env:esp32-poe-iso]
; Pinned: the espressif32 name now also matches the pioarduino platform used by
; [env:xiao-w5500], and unpinned specs resolve to the newest of the two.
platform = espressif32@7.0.1
board = esp32-poe-iso
framework = arduino
monitor_speed = 115200
test_ignore = test_atem_proto
board_build.embed_txtfiles =
	data/tally.html
	data/index.html
	data/director.html
lib_deps = 
	khoih-prog/WebServer_WT32_ETH01@^1.5.1
	bblanchon/ArduinoJson@^6.21.3
	Links2004/WebSockets@^2.3.7

[env:wt32-eth01]
; Pinned: the espressif32 name now also matches the pioarduino platform used by
; [env:xiao-w5500], and unpinned specs resolve to the newest of the two.
platform = espressif32@7.0.1
board = wt32-eth01
framework = arduino
monitor_speed = 115200
test_ignore = test_atem_proto
board_build.embed_txtfiles =
	data/tally.html
	data/index.html
	data/director.html
lib_deps = 
	khoih-prog/WebServer_WT32_ETH01@^1.5.1
	bblanchon/ArduinoJson@^6.21.3
	Links2004/WebSockets@^2.3.7

# Seeed Studio XIAO W5500 Ethernet Adapter (XIAO ESP32-S3 Plus + WIZnet W5500 on SPI).
# The stock espressif32 platform ships Arduino core 2.x, whose ETH class has no
# W5500/SPI support at all, so this env uses the pioarduino fork (core 3.x on
# IDF 5.x). There the W5500 runs in MACRAW mode through lwIP, so WebServer,
# WebSockets, mDNS and the ATEM/vMix/OBS clients all work over ETH unchanged.
[env:xiao-w5500]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
test_ignore = test_atem_proto
board_build.embed_txtfiles =
	data/tally.html
	data/index.html
	data/director.html
build_flags =
	-D CONTROLLER_ETH_W5500
lib_deps =
	bblanchon/ArduinoJson@^6.21.3
	Links2004/WebSockets@^2.7.3

# Host-side unit tests for the ATEM wire-format layer (lib/ATEMmini).
[env:native]
platform = native
test_filter = test_atem_proto

