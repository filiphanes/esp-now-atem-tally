;
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; `pio run` builds firmware, `pio test` runs host-side unit tests ([env:native]).
[platformio]
default_envs = esp32-poe-iso, wt32-eth01

[env:esp32-poe-iso]
; Pinned: the espressif32 name now also matches the pioarduino platform used by
; [env:xiao-w5500], and unpinned specs resolve to the newest of the two.
platform = espressif32@7.0.1
board = esp32-poe-iso
framework = arduino
monitor_speed = 115200
test_ignore = test_atem_proto
; src/idf/ holds the pure ESP-IDF port (see [env:xiao-w5500-idf]); it must not
; be compiled into the Arduino environments.
build_src_filter = +<*> -<idf/>
board_build.embed_txtfiles =
	data/tally.html
	data/index.html
	data/director.html
lib_deps = 
	khoih-prog/WebServer_WT32_ETH01@^1.5.1
	bblanchon/ArduinoJson@^6.21.3
	Links2004/WebSockets@^2.3.7

[env:wt32-eth01]
; Pinned: the espressif32 name now also matches the pioarduino platform used by
; [env:xiao-w5500], and unpinned specs resolve to the newest of the two.
platform = espressif32@7.0.1
board = wt32-eth01
framework = arduino
monitor_speed = 115200
test_ignore = test_atem_proto
; See the note in [env:esp32-poe-iso].
build_src_filter = +<*> -<idf/>
board_build.embed_txtfiles =
	data/tally.html
	data/index.html
	data/director.html
lib_deps = 
	khoih-prog/WebServer_WT32_ETH01@^1.5.1
	bblanchon/ArduinoJson@^6.21.3
	Links2004/WebSockets@^2.3.7

# Seeed Studio XIAO W5500 Ethernet Adapter (XIAO ESP32-S3 Plus + WIZnet W5500 on SPI).
# The stock espressif32 platform ships Arduino core 2.x, whose ETH class has no
# W5500/SPI support at all, so this env uses the pioarduino fork (core 3.x on
# IDF 5.x). There the W5500 runs in MACRAW mode through lwIP, so WebServer,
# WebSockets, mDNS and the ATEM/vMix/OBS clients all work over ETH unchanged.
[env:xiao-w5500]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
test_ignore = test_atem_proto
; See the note in [env:esp32-poe-iso].
build_src_filter = +<*> -<idf/>
board_build.embed_txtfiles =
	data/tally.html
	data/index.html
	data/director.html
build_flags =
	-D CONTROLLER_ETH_W5500
	-D WEBSOCKETS_TCP_TIMEOUT=2000
lib_deps =
	bblanchon/ArduinoJson@^6.21.3
	Links2004/WebSockets@^2.7.3

# Pure ESP-IDF port of the same XIAO W5500 hardware, built with the stock
# espressif32 platform so it shares the Receiver's IDF 6.0.1 toolchain.
# Sources live in src/idf/ (excluded from the Arduino envs above) and the
# W5500 driver comes from the component registry -- IDF 6.0 moved SPI
# Ethernet controllers out of esp_eth (see src/idf_component.yml).
# Slices 1-7: ETH + embedded UI pages + WebSocket tally feed + ESP-NOW/OSC +
# mDNS + NVS config + the ATEM and vMix clients + the vMix TCP tally server on
# port 8099 + the OBS client, all with the task watchdog armed.
[env:xiao-w5500-idf]
platform = espressif32@7.0.1
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
; PlatformIO generates partitions.bin from this CSV and ignores the
; CONFIG_PARTITION_TABLE_* choice in sdkconfig, so name the large layout here
; too (1.5 MB factory app).
board_build.partitions = partitions_singleapp_large.csv
; The project's src/ mixes C and C++ in one component. PlatformIO then feeds
; both languages the merged flag set, so the C++-only -fuse-cxa-atexit leaks
; into the C compiles and is rejected there (-Werror). Drop it everywhere: it
; only selects __cxa_atexit for static destructors, and neither the C files nor
; the project's few C++ statics (all PODs) have any.
build_unflags = -fuse-cxa-atexit
; The UI pages are embedded at CMake configure time, which PlatformIO does not
; re-run when data/*.html changes. This refreshes the generated assembly before
; each build so an edited page is not left stale in the firmware.
extra_scripts = post:scripts/embed_pages.py

# Host-side unit tests for the ATEM wire-format layer (lib/ATEMmini).
[env:native]
platform = native
test_filter = test_atem_proto

